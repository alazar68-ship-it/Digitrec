[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "szam-felismeres"
version = "0.1.5"
description = "Handwritten digit recognition: CLI training pipeline and Django+HTMX web UI."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Andras Lazar" }]

# Runtime dependencies are intentionally minimal.
# Note: Torch wheels are platform-specific (CPU vs CUDA). Pinning an exact build here can make installs harder.
# The project expects Torch 2.x.
dependencies = [
  "Django==5.1.5",
  "torch>=2.3,<3",
  "numpy>=1.26,<3",
  "torchvision>=0.18,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]

[project.scripts]
digitrec = "digitrec_cli.__main__:main"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "src/digitrec_web"]

[tool.hatch.build.targets.wheel]
packages = ["src/digitrec_core", "src/digitrec_cli", "src/digitrec_web/digitrec_web", "src/digitrec_web/digits"]
